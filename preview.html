<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>在线预览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
.bar{background:linear-gradient(135deg,#4f6ef7,#8b5cf6);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bar a{color:#fff;text-decoration:none;font-size:14px;opacity:.9}
.bar span{font-size:15px;font-weight:600;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{flex:1;border:none;width:100%}
</style></head><body>
<div class="bar"><a href="./">← 返回</a><span id="title">预览</span></div>
<iframe id="v"></iframe>
<script>
const p=new URLSearchParams(location.search);
const file=p.get('file')||'', type=p.get('type')||'pdf', name=p.get('name')||'文件';
document.getElementById('title').textContent=decodeURIComponent(name);
const v=document.getElementById('v');
if(type==='pdf'||type==='xls'){
  v.src='files/'+file;
}else{
  const u='https://zhoujunjie2002.github.io/cuotiji/files/'+file;
  v.src='https://view.officeapps.live.com/op/embed.aspx?src='+encodeURIComponent(u);
}
</script></body></html>
